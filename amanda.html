function MM_swapImgRestore() {
  var a = document.MM_sr || []; for (var i = 0; i < a.length; i++) if (a[i].oSrc) a[i].src = a[i].oSrc;
}
function MM_preloadImages() {
  for (var i = 0; i < arguments.length; i++) { if (arguments[i].charAt(0) !== '#') { var img = new Image(); img.src = arguments[i]; } }
}
function MM_swapImage() {
  document.MM_sr = []; for (var i = 0; i < arguments.length - 2; i += 3) { var el = document.getElementById(arguments[i]); if (el) { document.MM_sr.push(el); if (!el.oSrc) el.oSrc = el.src; el.src = arguments[i+2]; } }
}
</script>
